<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuperInject</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="topbar">
  <div id="banner">
    <span>⚠️</span>
    <span><b>仅供开发人员调试程序使用，严禁滥用，违规使用者后果自负！</b>
      <span class="dim">只能用于你自己拥有或已获得授权的目标进程。</span></span>
  </div>

  <header>
    <div class="brand">
      <span class="logo">SI</span>
      <div>
        <h1>SuperInject</h1>
        <div class="sub">基于 DLL 注入的快捷调试工具 · 仅限 Windows</div>
      </div>
    </div>
    <span class="grow"></span>
    <div class="checks">
      <span id="badge-admin" class="badge">权限检查中…</span>
      <span id="badge-dll" class="badge">DLL 校验中…</span>
      <span id="badge-arch" class="badge">–</span>
      <span id="badge-ver" class="badge">v–</span>
      <button id="btn-refresh" class="ghost">刷新进程</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-seg" data-target="panel-procs">进程</button>
    <button class="nav-seg" data-target="panel-inject">注入</button>
    <button class="nav-seg" data-target="panel-control">控制</button>
    <button class="nav-seg" data-target="panel-res">资源</button>
    <button class="nav-seg" data-target="panel-mem">内存</button>
    <button class="nav-seg" data-target="panel-log">日志</button>
  </nav>
</div>

<main>
  <section class="panel" id="panel-procs">
    <div class="panel-head">
      <h2>进程</h2>
      <input id="search" type="search" placeholder="按名称 / PID 搜索…" autocomplete="off" />
      <label class="chk"><input type="checkbox" id="sel-all" /> 全选</label>
      <label class="chk"><input type="checkbox" id="only-injected" /> 仅已注入</label>
      <span class="grow"></span>
      <input id="manual-pids" placeholder="手工输入 PID，逗号分隔" />
      <button id="btn-add-pids" class="ghost">加入</button>
    </div>
    <div class="table-wrap">
      <table id="proc-table">
        <thead>
          <tr>
            <th class="c-sel"></th>
            <th>PID</th>
            <th>进程名</th>
            <th>内存(MB)</th>
            <th>状态</th>
            <th class="c-path">路径</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="panel-inject">
    <div class="panel-head">
      <h2>注入</h2>
      <span id="dll-path" class="muted"></span>
      <span class="grow"></span>
      <button id="btn-verify" class="ghost">重新校验 DLL</button>
      <button id="btn-inject" class="primary">注入选中 (0)</button>
    </div>
  </section>

  <section class="panel" id="panel-control">
    <div class="panel-head">
      <h2>控制（批量）</h2>
      <span id="sel-count" class="muted">已选 0 个进程</span>
    </div>
    <div class="actions">
      <button class="act" data-act="ping">
        <svg class="ico" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M1.5 8h3l1.5-4 2.5 8 1.5-4h4.5"/></svg>连通性检查</button>
      <button class="act" data-act="info">
        <svg class="ico" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <rect x="2.2" y="2.2" width="11.6" height="11.6" rx="3"/>
          <path d="M5.5 6.8h5M5.5 9.4h3"/></svg>查看模块</button>
      <button class="act" data-act="freeze">
        <svg class="ico" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M8 2v12M3 5l10 6M13 5 3 11"/></svg>冻结进程</button>
      <button class="act" data-act="unfreeze">
        <svg class="ico" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M5.5 3.5 12 8l-6.5 4.5z"/></svg>解除冻结</button>
      <button class="act" data-act="resources">
        <svg class="ico" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <rect x="2" y="3" width="12" height="10" rx="2.5"/>
          <path d="M2.6 11.4 6 8.2l2.4 2.1 1.8-1.6 3.2 2.7"/></svg>查看进程资源</button>
    </div>
    <div class="actions danger-zone">
      <span class="zone-label">危险操作 · 会改变目标进程状态</span>
      <button class="act warn" data-act="unload">
        <svg class="ico" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M8 2v8M5 7.5 8 10.5l3-3M3 13h10"/></svg>卸载注入 DLL</button>
      <button class="act danger" data-act="terminate">
        <svg class="ico" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="8" cy="8" r="5.8"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8"/></svg>终止进程</button>
    </div>
  </section>

  <section class="panel" id="panel-res">
    <div class="panel-head">
      <h2>进程资源</h2>
      <span id="res-summary" class="muted">尚未提取</span>
      <span class="grow"></span>
      <button id="btn-reveal-all" class="ghost">打开导出目录</button>
    </div>
    <div id="res-grid" class="res-grid"></div>
  </section>

  <section class="panel" id="panel-mem">
    <div class="panel-head"><h2>内存调试</h2>
      <span class="hint">在进程表里选中目标后使用</span></div>
    <div class="mem-bar">
      <input id="mem-pattern" placeholder="十六进制模式，支持 ?? 通配，例如 4D 5A ?? ??" />
      <input id="mem-max" type="number" value="128" min="1" max="2000" title="最大结果数" />
      <button id="btn-search" class="primary">搜索选中进程内存</button>
    </div>
    <div id="mem-results" class="results"></div>
    <div id="mem-editor" class="editor hidden">
      <div class="row">
        <input id="ed-addr" placeholder="地址（十进制或 0x…）" />
        <input id="ed-size" type="number" value="64" />
        <button id="btn-read" class="ghost">读取</button>
      </div>
      <textarea id="ed-data" spellcheck="false" placeholder="十六进制数据，如 00 10 20 30"></textarea>
      <div class="row end">
        <span id="ed-msg" class="muted"></span>
        <button id="btn-write" class="danger">写入选中进程</button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-log">
    <div class="panel-head"><h2>日志 / 结果</h2>
      <span class="grow"></span>
      <button id="btn-clear" class="ghost">清空</button>
    </div>
    <div id="log" class="log"></div>
  </section>
</main>

<div id="update-modal" class="modal hidden">
  <div class="modal-box">
    <h3>发现新版本 <span id="up-ver"></span></h3>
    <p id="up-notes" class="muted"></p>
    <div class="row end">
      <button id="up-later" class="ghost">稍后再说</button>
      <button id="up-install" class="primary">下载并安装</button>
    </div>
    <div id="up-progress" class="muted hidden"></div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modal-title">确认</h3>
    <p id="modal-text"></p>
    <div class="row end">
      <button id="modal-cancel" class="ghost">取消</button>
      <button id="modal-ok" class="danger">确定</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
