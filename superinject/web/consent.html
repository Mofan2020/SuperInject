<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuperInject · MCP 授权</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font: 14px/1.5 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: #f5f5f7; color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f2f2f7; }
    .sic-card { background: #2c2c2e !important; }
    .sic-field input, .sic-field textarea, .sic-field select {
      background: #1c1c1e; color: #f2f2f7; border-color: #3a3a3c;
    }
    .sic-hint { color: #98989d; }
  }
  .sic-card {
    max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px;
    padding: 22px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.12);
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sic-sub { font-size: 12.5px; color: #6e6e73; margin-bottom: 16px; }
  .sic-field { margin-bottom: 14px; }
  .sic-field > label { display: block; font-weight: 600; margin-bottom: 6px; }
  .sic-hint { font-size: 12px; color: #6e6e73; margin-top: 4px; }
  .sic-field input[type="text"], .sic-field textarea, .sic-field select {
    width: 100%; padding: 8px 10px; border: 1px solid #d2d2d7;
    border-radius: 8px; font: inherit; resize: vertical;
  }
  .sic-caps { display: flex; flex-direction: column; gap: 8px; }
  .sic-cap { display: flex; align-items: flex-start; gap: 8px; }
  .sic-cap input { margin-top: 3px; }
  .sic-cap small { display: block; color: #6e6e73; }
  .sic-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  button { font: inherit; padding: 8px 16px; border-radius: 9px; border: 1px solid #d2d2d7;
    background: #fff; cursor: pointer; }
  button.sic-primary { background: #0071e3; border-color: #0071e3; color: #fff; }
  button.sic-danger { background: #ff3b30; border-color: #ff3b30; color: #fff; }
  .sic-status { margin-top: 12px; font-size: 12.5px; min-height: 18px; }
  .sic-status.err { color: #ff3b30; }
  .sic-status.ok { color: #34c759; }
</style>
</head>
<body>
<div class="sic-card">
  <h1>MCP 授权</h1>
  <div class="sic-sub">授权 AI Agent 通过 MCP 访问本机调试能力。会话有效期结束或文件被改动即失效。</div>

  <div class="sic-field">
    <label>能力分档</label>
    <div class="sic-caps">
      <label class="sic-cap"><input type="checkbox" id="sic-cap-read" checked disabled />
        <span>read<small>列举进程 / 读取内存 / 快照 / 事件 —— 自动授权</small></span></label>
      <label class="sic-cap"><input type="checkbox" id="sic-cap-write" />
        <span>write<small>写内存 / 冻结 / patch / 断点 / 卸载 —— 改变目标状态</small></span></label>
      <label class="sic-cap"><input type="checkbox" id="sic-cap-dangerous" />
        <span>dangerous<small>终止目标进程 —— 不可撤销</small></span></label>
    </div>
  </div>

  <div class="sic-field">
    <label for="sic-pids">PID 白名单</label>
    <input type="text" id="sic-pids" placeholder="1234,5678（留空则只按进程名匹配）" />
    <div class="sic-hint">逗号分隔。命中的 PID 直接放行。</div>
  </div>

  <div class="sic-field">
    <label for="sic-names">进程名通配符</label>
    <input type="text" id="sic-names" placeholder="notepad*,mytool.exe" />
    <div class="sic-hint">逗号分隔，大小写不敏感。与 PID 白名单是「或」的关系。</div>
  </div>

  <div class="sic-field">
    <label for="sic-ttl">有效期</label>
    <select id="sic-ttl">
      <option value="900">15 分钟</option>
      <option value="1800" selected>30 分钟</option>
      <option value="3600">60 分钟</option>
      <option value="7200">120 分钟</option>
    </select>
  </div>

  <div class="sic-row">
    <button id="sic-cancel">取消</button>
    <button id="sic-submit" class="sic-primary">授权</button>
  </div>
  <div id="sic-status" class="sic-status"></div>
</div>

<script>
  (function () {
    "use strict";
    function $(s) { return document.querySelector(s); }
    function api() { return window.pywebview && window.pywebview.api; }
    function status(msg, cls) {
      var el = $("#sic-status");
      el.textContent = msg || "";
      el.className = "sic-status" + (cls ? " " + cls : "");
    }
    function collect() {
      var caps = ["read"];
      if ($("#sic-cap-write").checked) caps.push("write");
      if ($("#sic-cap-dangerous").checked) caps.push("dangerous");
      return {
        pids: $("#sic-pids").value,
        names: $("#sic-names").value,
        capabilities: caps,
        ttl_seconds: parseInt($("#sic-ttl").value, 10) || 1800,
      };
    }
    function prefill(payload) {
      if (!payload) return;
      if (payload.pids) $("#sic-pids").value = payload.pids;
      if (payload.names) $("#sic-names").value = payload.names;
      var caps = payload.capabilities || [];
      $("#sic-cap-write").checked = caps.indexOf("write") >= 0;
      $("#sic-cap-dangerous").checked = caps.indexOf("dangerous") >= 0;
    }
    function submit() {
      var a = api();
      if (!a || !a.submit_consent) { status("后端未就绪", "err"); return; }
      status("提交中…");
      Promise.resolve(a.submit_consent(collect())).then(function (res) {
        if (res && res.ok) {
          status("已授权：" + (res.summary || ""), "ok");
        } else {
          status("授权失败：" + ((res && res.error) || "未知错误"), "err");
        }
      }).catch(function (e) { status("授权失败：" + e, "err"); });
    }
    // 主窗口以模态框形式复用它时，从这里打开并回填。
    window.SIConsent = {
      open: function (payload) { prefill(payload); status(""); },
      prefill: prefill,
      collect: collect,
      submit: submit,
    };
    document.addEventListener("DOMContentLoaded", function () {
      $("#sic-submit").addEventListener("click", submit);
      $("#sic-cancel").addEventListener("click", function () {
        if (window.close) { try { window.close(); } catch (e) {} }
      });
      if (window.pywebview && window.pywebview.api) status("");
    });
  })();
</script>
</body>
</html>
