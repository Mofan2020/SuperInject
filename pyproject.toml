[project]
name = "superinject"
version = "1.0.1"
description = "SuperInject —— 仅限 Windows 的基于 DLL 注入的快捷调试工具（仅供开发调试使用）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skyc8266" }]
keywords = ["windows", "debug", "dll-injection", "process-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "pywebview>=4.4",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Mofan2020/SuperInject"
Repository = "https://github.com/Mofan2020/SuperInject"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
