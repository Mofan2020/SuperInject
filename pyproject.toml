[project]
name = "superinject"
version = "1.0.1"
description = "SuperInject —— 仅限 Windows 的基于 DLL 注入的快捷调试工具（仅供开发调试使用）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skyc8266" }]
keywords = ["windows", "debug", "dll-injection", "process-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "pywebview>=4.4",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Mofan2020/SuperInject"
Repository = "https://github.com/Mofan2020/SuperInject"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["superinject/embedded", "native/build", "dist", "build/SuperInject.spec"]

[tool.ruff.lint]
# 只启用确定性的静态检查：pycodestyle 错误类 + pyflakes + import 排序。
# 显式声明规则集，避免 ruff 升级后默认集合变化导致 CI 突然变红。
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = ["E501"]
