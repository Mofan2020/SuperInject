name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1) MinGW-w64 交叉编译：-Wall -Wextra -Werror 零警告
  # ---------------------------------------------------------------
  native-mingw:
    name: 编译 DLL (MinGW-w64 / Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: 编译 agent.dll
        run: python build/build_native.py

      - name: 零警告静态检查 (-Werror)
        run: |
          x86_64-w64-mingw32-gcc -shared -O2 -Wall -Wextra -Werror \
            -DUNICODE -D_UNICODE native/agent.c native/superinject_json.c \
            -o /tmp/si_warncheck.dll -ladvapi32 -lshell32 -luser32

      - name: 校验产物为 64 位 PE DLL
        run: |
          python - <<'PY'
          import pathlib, struct
          data = pathlib.Path("native/build/SuperInjectAgent.dll").read_bytes()
          assert data[:2] == b"MZ", "不是有效的 PE 文件"
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe:pe + 4] == b"PE\0\0", "缺少 PE 签名"
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          assert machine == 0x8664, f"期望 x86-64，实际 0x{machine:04x}"
          characteristics = struct.unpack_from("<H", data, pe + 22)[0]
          assert characteristics & 0x2000, "缺少 IMAGE_FILE_DLL 标志"
          print(f"OK: PE32+ DLL, {len(data)} bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dll-mingw
          path: native/build/SuperInjectAgent.dll

  # ---------------------------------------------------------------
  # 2) MSVC 编译：使用 GitHub 自带的 windows runner（Visual Studio）
  # ---------------------------------------------------------------
  native-msvc:
    name: 编译 DLL (MSVC / Windows runner)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 显示工具链
        run: |
          cl 2>&1 | findstr /C:"Version"
          where cl

      - name: 定位 MSVC 环境
        shell: cmd
        run: |
          for %%E in (Enterprise Professional Community BuildTools); do (
            if exist "%ProgramFiles%\Microsoft Visual Studio\2022\%%E\VC\Auxiliary\Build\vcvars64.bat" (
              echo VCVARS=%ProgramFiles%\Microsoft Visual Studio\2022\%%E\VC\Auxiliary\Build\vcvars64.bat> %GITHUB_ENV%
              exit /b 0
            )
          )
          exit /b 1

      - name: 用 MSVC 编译（/W4 /WX 视为错误）
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          cl /nologo /LD /O2 /W4 /WX /wd4996 /DUNICODE /D_UNICODE ^
             native\agent.c native\superinject_json.c ^
             /Fe:native\build\SuperInjectAgent.dll ^
             /link advapi32.lib shell32.lib user32.lib
          if errorlevel 1 exit /b 1
          dir native\build\SuperInjectAgent.dll

      - name: 校验 MSVC 产物
        run: |
          python - <<'PY'
          import pathlib, struct
          p = pathlib.Path("native/build/SuperInjectAgent.dll")
          data = p.read_bytes()
          assert data[:2] == b"MZ"
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          assert machine == 0x8664
          assert struct.unpack_from("<H", data, pe + 22)[0] & 0x2000
          print("MSVC OK:", len(data), "bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dll-msvc
          path: native/build/SuperInjectAgent.dll

  # ---------------------------------------------------------------
  # 3) 纯逻辑单元测试：双平台
  # ---------------------------------------------------------------
  unit-tests:
    name: 单元测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q superinject build tests run_superinject.py

      - name: 跳过注入集成测试的 pytest
        run: python -m pytest tests -q --ignore=tests/test_integration_windows.py --junitxml=pytest-results/unit-${{ matrix.os }}.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-unit-${{ matrix.os }}
          path: pytest-results/unit-${{ matrix.os }}.xml

  # ---------------------------------------------------------------
  # 4) Windows runner 上跑真实注入集成测试（注入 notepad 并控制）
  # ---------------------------------------------------------------
  integration:
    name: 注入集成测试 (Windows)
    needs: [native-mingw, native-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 取回 MSVC 编译的 DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-msvc
          path: native/build

      - name: 确认当前进程具备提权能力
        run: |
          python -c "import ctypes;print('admin=',bool(ctypes.windll.shell32.IsUserAnAdmin()))"

      - name: 注入 / 内存读写 / 冻结 / 卸载 / 终止 端到端
        env:
          SUPERINJECT_DLL_PATH: native/build/SuperInjectAgent.dll
        run: |
          python -m pytest tests/test_integration_windows.py -v -x

  # ---------------------------------------------------------------
  # 5) 用 Windows runner + PyInstaller 打包可执行文件
  # ---------------------------------------------------------------
  package:
    name: 打包 SuperInject.exe
    needs: [unit-tests, integration, native-mingw]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（含 PyInstaller / WebView2）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 取回 MinGW 交叉编译的 DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-mingw
          path: native/build

      - name: 内嵌 DLL 到程序
        run: python build/make_payload.py

      - name: 校验内嵌字节与 DLL 一致
        run: |
          python - <<'PY'
          import hashlib, sys
          sys.path.insert(0, ".")
          from superinject import dll_manager as dm
          emb = dm.embedded_bytes()
          disk = open("native/build/SuperInjectAgent.dll", "rb").read()
          assert emb == disk, "内嵌字节与编译产物不一致"
          print("embedded sha256:", hashlib.sha256(emb).hexdigest())
          PY

      - name: PyInstaller 打包
        run: |
          python -m PyInstaller --noconfirm --clean --name SuperInject --windowed `
            --onedir --add-data "superinject/web;superinject/web" `
            --hidden-import webview.platforms.edgechromium run_superinject.py

      - name: 冒烟检查产物
        run: |
          python - <<'PY'
          import pathlib
          exe = pathlib.Path("dist/SuperInject/SuperInject.exe")
          assert exe.exists(), "未生成 SuperInject.exe"
          assert (pathlib.Path("dist/SuperInject/_internal/superinject/web/index.html")).exists()
          print("OK:", exe, exe.stat().st_size, "bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SuperInject-win-x64
          path: dist/SuperInject

  # ---------------------------------------------------------------
  # 6) 打 tag 自动发版
  # ---------------------------------------------------------------
  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SuperInject-win-x64
          path: dist
      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SuperInject/*
          generate_release_notes: true
          body: |
            ## ⚠️ 使用前必读

            **本工具仅供开发人员调试程序使用，严禁滥用，违规使用者后果自负！**

            - 只能用于你自己拥有、或已获得明确授权的目标进程；
            - 严禁用于绕过软件的授权 / 保护机制；
            - 未经授权对第三方进程注入 DLL 可能违反当地法律与服务条款，
              由此产生的一切后果由使用者自行承担。
