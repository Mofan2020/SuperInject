name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Windows runner 的控制台默认 cp1252：脚本里 print 中文会 UnicodeEncodeError
# 直接打挂构建步骤（真实踩到过）。统一切到 UTF-8。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1) 编译注入端 DLL —— **只在这一条产线上构建**
  #
  #     过去用 ubuntu + mingw-w64 交叉编译，再把那份 DLL 打进发布件；而集成测试
  #     用的是 MSVC 那份。结果是「发布件用的 DLL 从没被功能测试直接跑过，跑过的
  #     那份反而不发布」。现在统一：windows runner + MSVC，一份 DLL 既被集成测试
  #     跑、也进发布件，产物唯一、覆盖唯一。
  #
  #     mingw 仍保留在本机开发路径（build/build_native.py）—— macOS 上编译不了
  #     MSVC，本地只能靠它自测 C 代码。
  #
  #     同时编两份：x64 (主) + x86 (注入 x86 应用时需要)，都是 MSVC、与集成
  #     测试对齐。
  # ---------------------------------------------------------------
  native-msvc:
    name: 编译 DLL (MSVC / Windows runner)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 初始化 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: 用 MSVC 编译（/W4 /WX 视为错误）
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $suffix = if ($arch -eq 'x86') { '_x86' } else { '' }
          New-Item -ItemType Directory -Force native\build | Out-Null
          cl /nologo /LD /O2 /W4 /WX /wd4996 /DUNICODE /D_UNICODE native\agent.c native\superinject_json.c /Fe:native\build\SuperInjectAgent${suffix}.dll /link ws2_32.lib advapi32.lib shell32.lib user32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item native\build\SuperInjectAgent${suffix}.dll

      - name: JSON 层自测（MSVC 真编译真运行）
        shell: pwsh
        run: |
          # 与 ubuntu 上同一份自测：数组 push / dump / parse 必须真的跑通
          cl /nologo /W3 /wd4996 /I native tests\native\test_si_json.c native\superinject_json.c /Fe:tests\native\test_si_json.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          tests\native\test_si_json.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 校验 MSVC 产物
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, struct, os
          suffix = "_x86" if os.environ.get("MATRIX_ARCH") == "x86" else ""
          p = pathlib.Path(f"native/build/SuperInjectAgent{suffix}.dll")
          data = p.read_bytes()
          assert data[:2] == b"MZ"
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          expected = 0x014C if suffix else 0x8664
          assert machine == expected, f"机器码不符：{machine:#x} vs {expected:#x}"
          assert struct.unpack_from("<H", data, pe + 22)[0] & 0x2000
          print(f"MSVC {suffix or 'x64'} OK:", len(data), "bytes, machine=0x%04x" % machine)
          PY
        env:
          MATRIX_ARCH: ${{ matrix.arch }}

      - name: 导入表守卫：只允许依赖系统 DLL
        # 这个 DLL 要被 LoadLibrary 进**别人的进程**。用户机器没装 VC++ 运行库是
        # 常态，一旦导入 VCRUNTIME140/msvcp 之类，注入会直接失败且原因极难看出。
        shell: bash
        run: |
          suffix="${{ matrix.arch == 'x86' && '_x86' || '' }}"
          python build/check_dll_imports.py "native/build/SuperInjectAgent${suffix}.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: dll-msvc-${{ matrix.arch }}
          path: native/build/SuperInjectAgent${{ matrix.arch == 'x86' && '_x86' || '' }}.dll

  # ---------------------------------------------------------------
  # 2) 纯逻辑单元测试 + 静态检查：双平台
  #    （含本地预览服务、资源转换、自检报告等跨平台可跑的用例）
  # ---------------------------------------------------------------
  unit-tests:
    name: 单元测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q superinject build tests run_superinject.py

      - name: 代码风格检查 (ruff)
        run: python -m ruff check superinject build tests run_superinject.py

      - name: 单元测试（跳过需要注入真实进程的集成测试）
        run: |
          python -m pytest tests -q --ignore=tests/test_integration_windows.py --junitxml=pytest-results/unit-${{ matrix.os }}.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-unit-${{ matrix.os }}
          path: pytest-results/unit-${{ matrix.os }}.xml

  # ---------------------------------------------------------------
  # 3) 前端布局的无头渲染检查（Playwright + Chromium）
  #     界面在 pywebview 里，CI 上没有桌面，过去只能人肉看 —— 这一 job 用假后端
  #     把真实页面渲染出来，断言「整页可滚动 / 无横向溢出 / 各功能区都看得全」，
  #     并把「最小窗口」这种以前会看不全的场景固化下来。
  # ---------------------------------------------------------------
  ui-layout:
    name: 前端布局渲染检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: 渲染检查（布局 + 真实交互路径）
        run: python tests/ui/render_check.py --shots-dir ui-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots

  # ---------------------------------------------------------------
  # 4) Windows runner 上跑真实注入集成测试（注入 ping.exe 并控制它）
  # ---------------------------------------------------------------
  integration:
    name: 注入集成测试 (Windows)
    timeout-minutes: 30
    needs: [native-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 取回 MSVC 编译的 DLL（x64）
        uses: actions/download-artifact@v4
        with:
          name: dll-msvc-x64
          path: native/build

      - name: 取回 MSVC 编译的 DLL（x86）
        uses: actions/download-artifact@v4
        with:
          name: dll-msvc-x86
          path: native/build

      - name: 确认当前进程具备提权能力（注入前提）
        shell: bash
        run: |
          python -c "import ctypes,sys; ok=bool(ctypes.windll.shell32.IsUserAnAdmin()); print('admin=',ok); sys.exit(0 if ok else 1)"

      - name: 注入 / 内存读写 / 冻结 / 资源 / 卸载 / 终止 端到端
        shell: bash
        env:
          SUPERINJECT_DLL_PATH: native/build/SuperInjectAgent.dll
          SUPERINJECT_DLL_PATH_X86: native/build/SuperInjectAgent_x86.dll
          SUPERINJECT_DEBUG: "1"
        run: python -m pytest tests/test_integration_windows.py -v --timeout=300
        timeout-minutes: 20

      - name: SYSTEM 提权链路（真实令牌复制 + 真实创建 SYSTEM 进程）
        shell: bash
        run: python -m pytest tests/test_system_token_windows.py -v -rs --timeout=180

      - name: IPC 调试日志（末尾 160 行）
        if: always()
        shell: bash
        run: |
          if [ -f supinject-debug.log ]; then tail -n 160 supinject-debug.log; else echo "(无日志文件)"; fi

      - name: 注入端诊断日志 (agent-<pid>.log)
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:TEMP "SuperInject"
          Write-Host "== $dir =="
          if (-not (Test-Path $dir)) { Write-Host "(目录不存在)"; exit 0 }
          Get-ChildItem -Path $dir -Filter "agent-*.log" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "---- $($_.FullName) ----"
              Get-Content $_.FullName -Raw
            }

  # ---------------------------------------------------------------
  # 5) Windows runner + PyInstaller 打包，并压成发布用的 zip
  # ---------------------------------------------------------------
  package:
    name: 打包 SuperInject.exe
    needs: [unit-tests, integration, native-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（含 PyInstaller / WebView2）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 取回 MSVC 编译的 DLL（与集成测试跑的是同一份；x64 + x86）
        uses: actions/download-artifact@v4
        with:
          name: dll-msvc-x64
          path: native/build
      - uses: actions/download-artifact@v4
        with:
          name: dll-msvc-x86
          path: native/build

      - name: 内嵌 DLL 到程序
        run: python build/make_payload.py

      - name: 校验内嵌字节与 DLL 一致
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, sys
          sys.path.insert(0, ".")
          from superinject import dll_manager as dm
          for arch, fname in (("x64", "SuperInjectAgent.dll"),
                              ("x86", "SuperInjectAgent_x86.dll")):
              emb = dm.embedded_bytes(arch)
              assert emb is not None, f"{arch} 内嵌字节缺失"
              disk = open(f"native/build/{fname}", "rb").read()
              assert emb == disk, f"{arch} 内嵌字节与编译产物不一致"
              print(f"embedded {arch} sha256:", hashlib.sha256(emb).hexdigest(),
                    f"({len(emb)} bytes)")
          PY

      - name: PyInstaller 打包（单文件，无 _internal 目录）
        run: |
          python -m PyInstaller --noconfirm --clean --name SuperInject --windowed `
            --onefile --add-data "superinject/web;superinject/web" `
            --collect-submodules webview `
            --hidden-import webview.platforms.edgechromium run_superinject.py

      - name: 冒烟检查产物（必须只有单个 exe）
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          exe = pathlib.Path("dist/SuperInject.exe")
          assert exe.exists(), "未生成 dist/SuperInject.exe"
          # 单文件产物的硬判据：不能再有 _internal 目录 / 同名文件夹
          stray = [p for p in pathlib.Path("dist").iterdir()]
          assert not pathlib.Path("dist/SuperInject").exists(), f"出现目录产物: {stray}"
          assert exe.stat().st_size > 5 * 1024 * 1024, "exe 体积异常（可能没打进 webview）"
          print("OK 单文件:", exe, exe.stat().st_size, "bytes")
          print("dist/ 内容:", [p.name for p in stray])
          PY

      - name: 压缩为发布包（zip 里只有单个 exe）
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SuperInject.exe -DestinationPath dist/SuperInject-win-x64.zip -Force
          Get-Item dist/SuperInject-win-x64.zip | Select-Object Name, Length
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/SuperInject-win-x64.zip))
          # @() 强制成数组：单个条目时 PS 会退化成标量字符串，
          # 那时 $names[0] 取的是第一个字符而不是文件名
          $names = @($zip.Entries | ForEach-Object { $_.FullName })
          $zip.Dispose()
          Write-Host "zip 内文件: $names"
          if ($names.Count -ne 1 -or $names[0] -ne "SuperInject.exe") {
            Write-Error "发布包里不只有单个 exe: $names"; exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SuperInject-win-x64
          path: dist

  # ---------------------------------------------------------------
  # 6) 对「打包产物」做真实验证：运行 exe 的无界面自检
  #    校验内嵌 DLL → 注入真实进程 → 内存读写 → 冻结 → 卸载 → 重新注入 → 终止
  # ---------------------------------------------------------------
  exe-self-test:
    name: 打包产物自检 (SuperInject.exe --self-test)
    needs: [package]
    runs-on: windows-latest
    # 自检正常 2~3 分钟。曾经因为子进程复用解包目录卡死过，耗到上限才发现；
    # 卡死必须是「失败」，不能是「一直转圈」。
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SuperInject-win-x64
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 确认 runner 具备提权能力
        shell: pwsh
        run: |
          $admin = ([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "admin=$admin"
          if (-not $admin) { exit 1 }

      - name: 运行打包产物的无界面自检
        timeout-minutes: 8
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/SuperInject.exe" `
            -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          $report = "dist/self-test-report.json"
          if (-not (Test-Path $report)) { Write-Error "自检报告未生成"; exit 1 }
          Get-Content $report -Raw
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 冻结产物在「无控制台」下走 print 路径不得崩
        # GUI 子系统（--windowed）的 exe 没有控制台，sys.stdout 可能是 None；
        # 而启动自检的一串输出发生在 GUI 之前 —— 一旦裸 print 就会「双击没反应」。
        # --help 正是最短的那条 print 路径，用它证明这条路在真产物上是安全的。
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/SuperInject.exe" -ArgumentList "--help" `
            -Wait -PassThru -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Error "冻结产物 --help 退出码 $($p.ExitCode)（print 路径崩了）"
            exit 1
          }

      - name: 断言自检报告全部通过
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("dist/self-test-report.json")
                            .read_text(encoding="utf-8"))
          for step in data["steps"]:
              mark = "PASS" if step["ok"] else "FAIL"
              print(f"[{mark}] {step['name']}: {step['detail']}")
          assert data["ok"], f"自检失败 {data['failed']} 步"
          assert len(data["steps"]) >= 10, "自检步骤过少，链路没跑全"
          print(f"OK: {data['passed']}/{len(data['steps'])} 步通过, "
                f"版本 {data['version']}")
          PY

      - name: 自检失败时的诊断日志
        if: failure()
        shell: pwsh
        run: |
          $dir = Join-Path $env:TEMP "SuperInject"
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Filter "*.log" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "---- $($_.FullName) ----"
                Get-Content $_.FullName -Raw
              }
          }
          $log = Join-Path $env:LOCALAPPDATA "SuperInject\supinject.log"
          if (Test-Path $log) { Write-Host "---- $log ----"; Get-Content $log -Tail 120 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test-report
          path: dist/self-test-report.json

  # ---------------------------------------------------------------
  # 7) 打 tag 自动发版（正式版 + zip 资产，自动更新只认这个 zip）
  # ---------------------------------------------------------------
  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, exe-self-test, ui-layout]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SuperInject-win-x64
          path: dist
      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SuperInject-win-x64.zip
          prerelease: false
          generate_release_notes: true
          body: |
            ## 本版新增

            **命令行模式**：新增 `-c -y <command>`。`-c` 启动 CLI（不开 GUI），`-y` 一律同意免责，`-h` 单独可用。子命令包括 `list` / `inject` / `freeze` / `mem-read` / `mem-write` 等 16 个，子命令风格（`inject 1234`）与单串 DSL（`'inject 1234 --json'`）都支持。默认 plain text，加 `--json` 切 JSON。CLI 内部也走 `elevate.ensure_privilege`，自动 UAC/SYSTEM 提权。

            **进程按路径搜索**：进程列表新增 `--path` 过滤（子串匹配 `controller.list_processes()` 已有的 `path` 字段）。

            **x86 应用注入**：同时内嵌 x64 与 x86 两份 DLL（`DATA_B64` / `DATA_B64_X86`），CI 用 `ilammy/msvc-dev-cmd@v1` 的 `arch: x64/x86` 两条 job 并行构建，导入表守卫同步验证。`Controller.inject()` 按 `IsWow64Process` 自动判定目标位数选 DLL；显式 `--arch` 可强制。`preflight` 在跨位数时若该位数 DLL 可用只加 warning，不再 blocked。

            附带修了一个 PE 导出表偏移 bug：之前把 IMAGE_OPTIONAL_HEADER 的导出目录偏移（PE32=0x60 / PE32+=0x88）直接当成 NT headers 后的偏移，没加上 OptionalHeader 起点（0x18），实际应是 PE32=0x78 / PE32+=0xA0。CI 在 windows runner 上真注入 `C:\Windows\SysWOW64\ping.exe` 验证通过。

            ## ⚠️ 使用前必读

            **本工具仅供开发人员调试程序使用，严禁滥用，违规使用者后果自负！**

            - 只能用于你自己拥有、或已获得明确授权的目标进程；
            - 严禁用于绕过软件的授权 / 保护机制；
            - 未经授权对第三方进程注入 DLL 可能违反当地法律与服务条款，
              由此产生的一切后果由使用者自行承担。

            ## 本版验证情况

            注入端 DLL 由 MSVC 在本仓库的 windows runner 上构建，与集成测试跑的是**同一份**。

            CI 在 windows-latest 上完成了两层真实验证：
            1. `pytest tests/test_integration_windows.py` —— 真实注入 `ping.exe`，
               覆盖注入检查 / 内存搜索与读写（含只读页改写）/ 冻结与解除（核实线程挂起状态）/
               资源提取 / 卸载 / 重新注入 / 自我终止；新增 `test_x86_injection_on_syswow64_ping`
               在 `C:\Windows\SysWOW64\ping.exe`（32 位）上验证 x86 注入链路。
            2. `SuperInject.exe --self-test` —— 直接跑**本页下载的打包产物**，
               用内嵌 DLL 走一遍完整链路，报告见该次 CI 运行的 `self-test-report` 工件。

